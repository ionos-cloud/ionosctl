name: E2E Tests

permissions:
  contents: read
  checks: write
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number'
        required: true
        type: string
      suite:
        description: 'Test suite to run (e.g. compute/server, dbaas/postgres-v2, dns, all)'
        required: true
        type: string

jobs:
  run-e2e-tests:
    env:
      IONOS_USERNAME: ${{ secrets.IONOS_USERNAME }}
      IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
    runs-on: ubuntu-latest
    steps:
      # Resolve the PR head SHA up front (via the API, no checkout needed) so a
      # check run can be reported for every outcome below - including failures
      # that happen before/instead of the test run, and cancellations.
      - name: Validate inputs and resolve PR head SHA
        id: init
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SUITE: ${{ github.event.inputs.suite }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          if [[ ! "$SUITE" =~ ^[a-zA-Z0-9/_-]+$ ]]; then
            echo "Invalid suite name: $SUITE"
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $PR_NUMBER"
            exit 1
          fi
          SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid -q .headRefOid)
          if [ -z "$SHA" ]; then
            echo "Could not resolve head SHA for PR #$PR_NUMBER"
            exit 1
          fi
          echo "commit-sha=$SHA" >> "$GITHUB_OUTPUT"

      # Create an in-progress check run on the PR head commit. This renders as a
      # first-class check (name + Actions icon + details link + duration), much
      # closer to native workflow checks than a flat commit status.
      - name: Create check run
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUITE: ${{ github.event.inputs.suite }}
          SHA: ${{ steps.init.outputs.commit-sha }}
        run: |
          CHECK_ID=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/check-runs \
            -f name="Manual E2E Test / ${SUITE}" \
            -f head_sha="$SHA" \
            -f status='in_progress' \
            -f started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f details_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --jq '.id')
          echo "id=$CHECK_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: gh pr checkout "$PR_NUMBER"

      # A mistyped / nonexistent suite must NOT fail the job (that would red-X the
      # PR for a bad /test comment). Flag it and skip the run instead; the report
      # step below concludes the check as "skipped" (neutral, non-blocking).
      - name: Validate suite exists
        id: suite
        env:
          SUITE: ${{ github.event.inputs.suite }}
        run: |
          if [ "$SUITE" = "all" ] || [ -f "test/suites/${SUITE}.bats" ] || [ -d "test/suites/${SUITE}" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Suite not found: test/suites/${SUITE}.bats (or directory test/suites/${SUITE}/)"
            echo "Available suites:"
            find test/suites -name '*.bats' ! -name 'setup.bats' | sed 's|test/suites/||; s|\.bats$||' | sort
          fi

      - name: Set up Go
        if: steps.suite.outputs.found == 'true'
        uses: actions/setup-go@v3
        with:
          go-version-file: 'go.mod'

      - name: Install bats-core
        if: steps.suite.outputs.found == 'true'
        run: |
          git clone https://github.com/bats-core/bats-core.git
          cd bats-core
          sudo ./install.sh /usr/local

      - name: Build and install
        if: steps.suite.outputs.found == 'true'
        run: make build && make install

      - name: Run E2E tests
        if: steps.suite.outputs.found == 'true'
        env:
          LIBS_PATH: ${{ github.workspace }}/test/libs
          SUITE: ${{ github.event.inputs.suite }}
        run: |
          if [ "$SUITE" = "all" ]; then
            find test/suites -name '*.bats' ! -name 'setup.bats' -exec bats {} +
          elif [ -d "test/suites/${SUITE}" ]; then
            find "test/suites/${SUITE}" -name '*.bats' ! -name 'setup.bats' -exec bats {} +
          else
            bats "test/suites/${SUITE}.bats"
          fi

      # Finalize the check run for every terminal outcome. Runs even on
      # cancellation / timeout (always()), so an in-progress check never gets
      # stranded. Skips only when no check was created (invalid inputs).
      - name: Report check run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUITE: ${{ github.event.inputs.suite }}
          JOB_STATUS: ${{ job.status }}
          CHECK_ID: ${{ steps.check.outputs.id }}
          SUITE_FOUND: ${{ steps.suite.outputs.found }}
        run: |
          if [ -z "$CHECK_ID" ]; then
            echo "No check run created; skipping report."
            exit 0
          fi
          if [ "$SUITE_FOUND" = "false" ]; then
            CONCLUSION='skipped'; TITLE="Skipped: suite '${SUITE}' not found"
          else
            case "$JOB_STATUS" in
              success)   CONCLUSION='success';  TITLE='Passed' ;;
              cancelled) CONCLUSION='cancelled'; TITLE='Cancelled' ;;
              *)         CONCLUSION='failure';  TITLE="Failed (${JOB_STATUS})" ;;
            esac
          fi
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/check-runs/${CHECK_ID} \
            -f status='completed' \
            -f conclusion="$CONCLUSION" \
            -f completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f details_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f "output[title]=${TITLE}" \
            -f "output[summary]=E2E suite \`${SUITE}\` — ${TITLE}. See the run log for details."
