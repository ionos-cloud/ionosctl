name: E2E Tests

permissions:
  contents: read
  statuses: write
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number'
        required: true
        type: string
      suite:
        description: 'Test suite to run (e.g. compute/server, dbaas/postgres-v2, dns, all)'
        required: true
        type: string

jobs:
  run-e2e-tests:
    env:
      IONOS_USERNAME: ${{ secrets.IONOS_USERNAME }}
      IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
    runs-on: ubuntu-latest
    steps:
      # Resolve the PR head SHA up front (via the API, no checkout needed) so a
      # commit status can be reported for every outcome below - including
      # failures that happen before/instead of the test run, and cancellations.
      - name: Validate inputs and resolve PR head SHA
        id: init
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SUITE: ${{ github.event.inputs.suite }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          if [[ ! "$SUITE" =~ ^[a-zA-Z0-9/_-]+$ ]]; then
            echo "Invalid suite name: $SUITE"
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $PR_NUMBER"
            exit 1
          fi
          SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid -q .headRefOid)
          if [ -z "$SHA" ]; then
            echo "Could not resolve head SHA for PR #$PR_NUMBER"
            exit 1
          fi
          echo "commit-sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create Pending Status Check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUITE: ${{ github.event.inputs.suite }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/statuses/${{ steps.init.outputs.commit-sha }} \
            -f state='pending' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            -f description='Running...' \
            -f context="test-${SUITE}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: gh pr checkout "$PR_NUMBER"

      - name: Validate suite exists
        env:
          SUITE: ${{ github.event.inputs.suite }}
        run: |
          if [ "$SUITE" != "all" ] && [ ! -f "test/suites/${SUITE}.bats" ] && [ ! -d "test/suites/${SUITE}" ]; then
            echo "Suite not found: test/suites/${SUITE}.bats (or directory test/suites/${SUITE}/)"
            echo "Available suites:"
            find test/suites -name '*.bats' ! -name 'setup.bats' | sed 's|test/suites/||; s|\.bats$||' | sort
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version-file: 'go.mod'

      - name: Install bats-core
        run: |
          git clone https://github.com/bats-core/bats-core.git
          cd bats-core
          sudo ./install.sh /usr/local

      - name: Build and install
        run: make build && make install

      - name: Run E2E tests
        env:
          LIBS_PATH: ${{ github.workspace }}/test/libs
          SUITE: ${{ github.event.inputs.suite }}
        run: |
          if [ "$SUITE" = "all" ]; then
            find test/suites -name '*.bats' ! -name 'setup.bats' -exec bats {} +
          elif [ -d "test/suites/${SUITE}" ]; then
            find "test/suites/${SUITE}" -name '*.bats' ! -name 'setup.bats' -exec bats {} +
          else
            bats "test/suites/${SUITE}.bats"
          fi

      # Single reporter for every terminal outcome. Runs even on cancellation /
      # timeout (always()), so a pending check never gets stranded. Skips only
      # when no SHA was resolved (invalid inputs) - nothing was posted then either.
      - name: Report status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUITE: ${{ github.event.inputs.suite }}
          JOB_STATUS: ${{ job.status }}
          SHA: ${{ steps.init.outputs.commit-sha }}
        run: |
          if [ -z "$SHA" ]; then
            echo "No PR head SHA resolved; skipping status report."
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            STATE='success'
            DESC='Passed'
          else
            STATE='failure'
            DESC="Failed (${JOB_STATUS})"
          fi
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/statuses/${SHA} \
            -f state="$STATE" \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            -f description="$DESC" \
            -f context="test-${SUITE}"
